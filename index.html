<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mochi's Gym Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Baloo 2', system-ui, sans-serif;
    background: linear-gradient(180deg, #ffe3f0 0%, #fff5fa 55%, #ffe3f0 100%);
    color: #5b2333;
    min-height: 100vh;
    padding: 20px 14px 40px;
  }
  .app { max-width: 480px; margin: 0 auto; }
  .mascot { display: block; width: 150px; margin: 4px auto 0; border-radius: 50%; }
  h1 { text-align: center; font-size: 30px; font-weight: 800; color: #d63384; line-height: 1.1; }
  .subtitle { text-align: center; color: #b06a8a; font-size: 15px; margin-bottom: 16px; }
  .card {
    background: #fff; border: 2px solid #ffb3d1; border-radius: 24px;
    padding: 20px; margin-bottom: 14px; box-shadow: 0 4px 16px rgba(214, 51, 132, .12);
  }
  .day-chips { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-bottom: 16px; }
  .chip {
    border: 2px solid #ffb3d1; background: #fff; color: #d63384; border-radius: 999px;
    padding: 8px 12px; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .chip.active { background: #ff7ab8; color: #fff; border-color: #ff7ab8; }
  .btn {
    display: block; width: 100%; border: none; border-radius: 999px; cursor: pointer;
    background: #ff7ab8; color: #fff; font-family: inherit; font-weight: 800;
    font-size: 19px; padding: 15px; margin-top: 12px;
    box-shadow: 0 4px 0 #e0559b; transition: transform .05s;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #e0559b; }
  .btn.secondary { background: #fff; color: #d63384; border: 2px solid #ffb3d1; box-shadow: none; }
  .btn.small { font-size: 15px; padding: 10px; margin-top: 8px; }
  .progress { height: 12px; background: #ffe3f0; border-radius: 999px; overflow: hidden; margin: 10px 0 4px; }
  .progress > div { height: 100%; background: linear-gradient(90deg, #ff7ab8, #ff4d9d); border-radius: 999px; transition: width .3s; }
  .progress-label { text-align: center; color: #b06a8a; font-size: 14px; font-weight: 600; }
  .ex-name { font-size: 24px; font-weight: 800; color: #d63384; text-align: center; }
  .ex-baseline { text-align: center; color: #b06a8a; font-size: 15px; margin: 4px 0 16px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-weight: 700; font-size: 15px; color: #8a4a63; margin-bottom: 4px; }
  .field input {
    width: 100%; font-family: inherit; font-size: 22px; font-weight: 700; color: #5b2333;
    border: 2px solid #ffb3d1; border-radius: 16px; padding: 12px 14px; background: #fff7fb; outline: none;
  }
  .field input:focus { border-color: #ff7ab8; }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }
  .row-btns { display: flex; gap: 10px; }
  .row-btns .btn { margin-top: 0; }
  .pr-badge {
    display: inline-block; background: #ffe066; color: #7a4d00; font-weight: 800;
    border-radius: 999px; padding: 4px 14px; font-size: 15px; margin-top: 8px;
  }
  .summary {
    white-space: pre-wrap; background: #fff7fb; border: 2px dashed #ffb3d1;
    border-radius: 16px; padding: 14px; font-size: 16px; line-height: 1.55; font-weight: 600;
  }
  .hist-item { border-bottom: 1px dashed #ffc2da; padding: 10px 2px; }
  .hist-item:last-child { border-bottom: none; }
  .hist-item b { color: #d63384; }
  .hist-item .meta { color: #b06a8a; font-size: 13px; }
  .hist-summary { white-space: pre-wrap; background: #fff7fb; border-radius: 12px; padding: 10px; margin-top: 8px; font-size: 14px; display: none; }
  .hist-item.open .hist-summary { display: block; }
  .hidden { display: none !important; }
  .center { text-align: center; }
  .big-emoji { font-size: 44px; }
  .note { color: #b06a8a; font-size: 14px; text-align: center; margin-top: 10px; }
</style>
</head>

  <h1>Mochi's Gym Log</h1>
  <p class="subtitle">your kawaii lifting buddy</p>

  <!-- HOME -->
  <div id="home">
    <div class="card">
      <p class="center" style="font-weight:700; font-size:17px;" id="todayLabel"></p>
      <div class="day-chips" id="dayChips"></div>
      <button class="btn" id="startBtn">Start workout</button>
      <p class="note" id="dayNote"></p>
    </div>
    <div class="card" id="historyCard">
      <h2 style="font-size:20px; color:#d63384; margin-bottom:6px;">History</h2>
      <div id="historyList"><p class="note">No sessions logged yet. Your first one will live here.</p></div>
    </div>
  </div>

  <!-- WORKOUT -->
  <div id="workout" class="hidden">
    <div class="card">
      <p class="progress-label" id="progressLabel"></p>
      <div class="progress"><div id="progressBar"></div></div>
      <h2 class="ex-name" id="exName"></h2>
      <p class="ex-baseline" id="exBaseline"></p>
      <div id="exFields"></div>
      <div id="prSpot" class="center"></div>
      <div class="row-btns" style="margin-top:16px;">
        <button class="btn secondary" id="backBtn">Back</button>
        <button class="btn secondary" id="skipBtn">Skip</button>
        <button class="btn" id="nextBtn">Next</button>
      </div>
    </div>
  </div>

  <!-- ABS -->
  <div id="absStep" class="hidden">
    <div class="card center">
      <p class="big-emoji">✨</p>
      <h2 style="font-size:22px; color:#d63384;">Abs circuit today?</h2>
      <p class="note" style="margin-bottom:6px;">Dead bugs, flutter kicks, dead bug crunches, bicycle crunches</p>
      <button class="btn" id="absYes">Yes, did it</button>
      <button class="btn secondary" id="absNo">Skip it</button>
    </div>
  </div>

  <!-- FINISH -->
  <div id="finish" class="hidden">
    <div class="card">
      <p class="center big-emoji">🎀</p>
      <h2 class="center" style="font-size:22px; color:#d63384;" id="finishTitle">Workout complete!</h2>
      <p class="center note" id="finishSub"></p>
      <div class="summary" id="summaryText" style="margin-top:14px;"></div>
      <button class="btn" id="copyBtn">Copy for Muse</button>
      <p class="note" id="copyNote">Paste it in chat and it gets filed in your training log.</p>
      <button class="btn secondary" id="doneBtn">Back home</button>
    </div>
  </div>
</div>
<script>
const SPLIT = {
  Mon: { title: "MONDAY - PUSH DAY", exercises: [
    { name: "Bench Press", sets: 3, reps: 8, weight: 15 },
    { name: "Incline Dumbbell Press", sets: 3, reps: 6, weight: 25 },
    { name: "Overhead Press", sets: 3, reps: 2, weight: 50 },
    { name: "Lateral Raises", sets: 3, reps: 8, weight: 20 },
    { name: "Cable Fly", sets: 3, reps: 8, weight: 30 },
    { name: "Triceps Pushdown", sets: 3, reps: 5, weight: 70 },
    { name: "Overhead Triceps Extension", sets: 3, reps: 4, weight: 30 },
  ]},
  Tue: { title: "TUESDAY - PULL DAY", exercises: [
    { name: "Lat Pulldown", sets: 3, reps: 8, weight: 75 },
    { name: "Barbell Row", sets: 3, reps: 8, weight: 60 },
    { name: "Seated Cable Row", sets: 3, reps: 5, weight: 85 },
    { name: "Seated Face Pulls", sets: 3, reps: 7, weight: 90 },
    { name: "Dumbbell Shrugs", sets: 3, reps: 5, weight: 40 },
    { name: "Barbell Curl", sets: 3, reps: 4, weight: 40 },
    { name: "Hammer Curl", sets: 3, reps: 6, weight: 15 },
    { name: "Wrist Curls", sets: 2, reps: 5, weight: 8 },
  ]},
  Wed: { title: "WEDNESDAY - LEGS", exercises: [
    { name: "Back Squat", sets: 3, reps: 5, weight: 45 },
    { name: "Bulgarian Split Squat", sets: 3, reps: 6, weight: 35, note: "single DB" },
    { name: "Leg Press", sets: 3, reps: 8, weight: 140 },
    { name: "Leg Extension", sets: 3, reps: 8, weight: 110 },
    { name: "Standing Calf Raises", sets: 2, reps: 8, weight: 60 },
  ]},
  Thu: { title: "THURSDAY - UPPER FOCUS", exercises: [
    { name: "Assisted Pull-ups", sets: 4, reps: 4, weight: 45, unit: "assist" },
    { name: "Incline Press", sets: 3, reps: 7, weight: 25 },
    { name: "Chest Supported Row", sets: 3, reps: 4, weight: 35 },
    { name: "Machine Shoulder Press", sets: 3, reps: 7, weight: 25 },
    { name: "Cable Laterals", sets: 3, reps: 8, weight: 20 },
    { name: "Rear Delt Fly", sets: 3, reps: 4, weight: 40 },
    { name: "Superset: EZ Bar Curl + Skull Crushers", sets: 3, reps: 5, weight: 30, weight2: 20, superset: true },
    { name: "Stair Master", sets: 1, reps: 15, unit: "min" },
  ]},
  Fri: { title: "FRIDAY - LOWER FOCUS", exercises: [
    { name: "RDL", sets: 3, reps: 8, weight: 35 },
    { name: "Hip Thrust", sets: 3, reps: 5, weight: 80 },
    { name: "Seated Leg Curl", sets: 3, reps: 7, weight: 80 },
    { name: "Walking Lunges", sets: 2, reps: 8, weight: 20, note: "each leg" },
    { name: "Seated Calf Raises", sets: 2, reps: 8, weight: 35 },
    { name: "Plank", sets: 3, reps: 50, unit: "sec" },
    { name: "Russian Twists", sets: 3, reps: 15, weight: 15 },
  ]},
  Sat: { title: "SATURDAY - 7K RUN", run: true },
  Sun: { title: "SUNDAY - REST", rest: true },
};
const DAY_NAMES = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const DAY_FULL = { Sun: "Sunday", Mon: "Monday", Tue: "Tuesday", Wed: "Wednesday", Thu: "Thursday", Fri: "Friday", Sat: "Saturday" };
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

let selectedDay = DAY_NAMES[new Date().getDay()];
let idx = 0, results = [], absDone = false;

const $ = id => document.getElementById(id);
const show = id => { ["home", "workout", "absStep", "finish"].forEach(s => $(s).classList.add("hidden")); $(id).classList.remove("hidden"); };

function renderChips() {
  $("dayChips").innerHTML = DAY_NAMES.map(d =>
    `<button class="chip ${d === selectedDay ? "active" : ""}" data-day="${d}">${d}</button>`).join("");
  document.querySelectorAll(".chip").forEach(c => c.onclick = () => { selectedDay = c.dataset.day; renderChips(); renderHome(); });
}

function renderHome() {
  const d = SPLIT[selectedDay];
  const today = DAY_NAMES[new Date().getDay()];
  $("todayLabel").textContent = selectedDay === today ? `Today is ${DAY_FULL[selectedDay]} · ${d.title}` : `${DAY_FULL[selectedDay]} · ${d.title}`;
  $("dayNote").textContent = d.rest
    ? "Rest day. Sleep in, stretch, eat well. The weights will wait."
    : d.run ? "7K + strides. Easy pace, strong finish." : `${d.exercises.length} exercises on the list.`;
  $("startBtn").textContent = d.rest ? "Log a rest day note" : d.run ? "Start run log" : "Start workout";
  renderHistory();
}

function renderHistory() {
  const hist = JSON.parse(localStorage.getItem("gymlog-history") || "[]");
  if (!hist.length) { $("historyList").innerHTML = `<p class="note">No sessions logged yet. Your first one will live here.</p>`; return; }
  $("historyList").innerHTML = hist.map((h, i) => `
    <div class="hist-item" data-i="${i}">
      <b>${h.date}</b> · ${h.title} <span class="meta">(${h.prs} PR${h.prs === 1 ? "" : "s"})</span>
      <div class="hist-summary">${h.summary.replace(/</g, "&lt;")}</div>
    </div>`).join("");
  document.querySelectorAll(".hist-item").forEach(el => el.onclick = () => el.classList.toggle("open"));
}

function startWorkout() {
  const d = SPLIT[selectedDay];
  if (d.rest) {
    const summary = `${d.title}\n\nRest day. Recovery is training too.\n\nDATE : ${new Date().getDate()} ${MONTHS[new Date().getMonth()]}`;
    saveSession(summary, 0);
    showFinish(summary, 0, true);
    return;
  }
  idx = 0; results = []; absDone = false;
  if (d.run) { renderRunCard(); }
  else { renderCard(); }
  show("workout");
}

function unitLabel(ex) {
  if (ex.unit === "assist") return "assist";
  if (ex.unit === "sec") return "sec";
  if (ex.unit === "min") return "min";
  return "lb";
}

function renderCard() {
  const ex = SPLIT[selectedDay].exercises[idx];
  const prev = results[idx] || {};
  $("progressLabel").textContent = `Exercise ${idx + 1} of ${SPLIT[selectedDay].exercises.length}`;
  $("progressBar").style.width = `${((idx) / SPLIT[selectedDay].exercises.length) * 100}%`;
  $("exName").textContent = ex.name;
  $("exBaseline").textContent = ex.superset
    ? `Last time: ${ex.sets}x${ex.reps} · EZ ${ex.weight} + Skull ${ex.weight2}`
    : `Last time: ${ex.sets}x${ex.reps} @ ${ex.weight} ${unitLabel(ex)}${ex.note ? " (" + ex.note + ")" : ""}`;
  let fields = `<div class="field-row">
    <div class="field"><label>Sets</label><input id="inSets" type="number" inputmode="numeric" value="${prev.sets ?? ex.sets}"></div>
    <div class="field"><label>${ex.unit === "sec" ? "Seconds" : ex.unit === "min" ? "Minutes" : "Reps"}</label><input id="inReps" type="number" inputmode="numeric" value="${prev.reps ?? ex.reps}"></div>
  </div>`;
  if (!ex.unit || ex.unit === "assist") {
    fields += `<div class="field"><label>Weight (${unitLabel(ex)})</label><input id="inWeight" type="number" inputmode="numeric" value="${prev.weight ?? ex.weight}"></div>`;
  }
  if (ex.superset) {
    fields += `<div class="field-row">
      <div class="field"><label>EZ Bar Curl (lb)</label><input id="inWeight" type="number" inputmode="numeric" value="${prev.weight ?? ex.weight}"></div>
      <div class="field"><label>Skull Crushers (lb)</label><input id="inWeight2" type="number" inputmode="numeric" value="${prev.weight2 ?? ex.weight2}"></div>
    </div>`;
  }
  $("exFields").innerHTML = fields;
  $("prSpot").innerHTML = "";
  $("nextBtn").textContent = idx === SPLIT[selectedDay].exercises.length - 1 ? "Finish" : "Next";
  $("backBtn").style.visibility = idx === 0 ? "hidden" : "visible";
  $("exFields").querySelectorAll("input").forEach(inp => inp.addEventListener("input", checkPR));
  checkPR();
}

function checkPR() {
  const ex = SPLIT[selectedDay].exercises[idx];
  const w = parseFloat($("inWeight")?.value), r = parseFloat($("inReps")?.value);
  let isPR = false;
  if (ex.unit === "min" || ex.unit === "sec") { isPR = r > ex.reps; }
  else if (!isNaN(w) && !isNaN(r)) { isPR = w > ex.weight || (w === ex.weight && r > ex.reps); }
  $("prSpot").innerHTML = isPR ? `<span class="pr-badge">PR! New best</span>` : "";
  return isPR;
}

function saveCurrent() {
  const ex = SPLIT[selectedDay].exercises[idx];
  const entry = { name: ex.name, sets: parseInt($("inSets").value), reps: parseInt($("inReps").value), skipped: false };
  if ($("inWeight")) entry.weight = parseFloat($("inWeight").value);
  if ($("inWeight2")) entry.weight2 = parseFloat($("inWeight2").value);
  entry.unit = ex.unit || null; entry.superset = !!ex.superset; entry.base = ex;
  entry.pr = checkPR();
  results[idx] = entry;
}

function renderRunCard() {
  const prev = results[0] || {};
  $("progressLabel").textContent = "Saturday run";
  $("progressBar").style.width = "50%";
  $("exName").textContent = "7K Run";
  $("exBaseline").textContent = "Last time: 8K in 48:48 (6:06/km)";
  $("exFields").innerHTML = `
    <div class="field"><label>Distance (km)</label><input id="inDist" type="number" step="0.1" inputmode="decimal" value="${prev.dist ?? 7}"></div>
    <div class="field"><label>Time (minutes)</label><input id="inTime" type="number" inputmode="numeric" value="${prev.time ?? ""}"></div>
    <div class="field"><label>Strides (20s each)</label><input id="inStrides" type="number" inputmode="numeric" value="${prev.strides ?? 5}"></div>`;
  $("prSpot").innerHTML = "";
  $("nextBtn").textContent = "Finish";
  $("backBtn").style.visibility = "hidden";
  $("skipBtn").onclick = () => { results[0] = { skipped: true }; showAbs(); };
  $("nextBtn").onclick = () => {
    results[0] = { dist: parseFloat($("inDist").value), time: parseFloat($("inTime").value), strides: parseInt($("inStrides").value), skipped: false };
    showAbs();
  };
  $("backBtn").onclick = () => { show("home"); renderHome(); };
}

function showAbs() {
  const d = SPLIT[selectedDay];
  if (d.run) { finishSession(); return; }
  show("absStep");
}

function buildSummary() {
  const d = SPLIT[selectedDay];
  const now = new Date();
  const dateStr = `${now.getDate()} ${MONTHS[now.getMonth()]}`;
  if (d.run) {
    const r = results[0];
    let lines = `${d.title}\n\n`;
    lines += r.skipped ? "Skipped today." : `${r.dist}K in ${r.time} min · ${r.strides} strides`;
    return { text: `${lines}\n\nDATE : ${dateStr}`, prs: 0 };
  }
  let lines = `${d.title}\n\n`, prs = 0;
  results.forEach(r => {
    if (!r || r.skipped) return;
    if (r.pr) prs++;
    const fire = r.pr ? " 🔥" : "";
    if (r.superset) {
      lines += `Superset ${r.reps}x${r.sets}: EZ Curl (${r.weight}) + Skull Crushers (${r.weight2})${fire}\n`;
    } else if (r.unit === "sec") {
      lines += `${r.name} ${r.reps}s x ${r.sets}${fire}\n`;
    } else if (r.unit === "min") {
      lines += `${r.name} ${r.reps} min${fire}\n`;
    } else if (r.unit === "assist") {
      lines += `${r.name} ${r.reps}x${r.sets} (${r.weight} assist)${fire}\n`;
    } else if (r.weight !== undefined) {
      lines += `${r.name} ${r.reps}x${r.sets} (${r.weight})${fire}\n`;
    } else {
      lines += `${r.name} ${r.reps}x${r.sets}${fire}\n`;
    }
  });
  if (absDone) lines += `\nAbs circuit: done`;
  return { text: `${lines}\nDATE : ${dateStr}`, prs };
}

function saveSession(summary, prs) {
  const now = new Date();
  const hist = JSON.parse(localStorage.getItem("gymlog-history") || "[]");
  hist.unshift({ date: `${now.getDate()} ${MONTHS[now.getMonth()]}`, title: SPLIT[selectedDay].title, summary, prs });
  localStorage.setItem("gymlog-history", JSON.stringify(hist.slice(0, 30)));
}

function finishSession() {
  const { text, prs } = buildSummary();
  saveSession(text, prs);
  showFinish(text, prs, false);
}

function showFinish(summary, prs, isRest) {
  $("finishTitle").textContent = isRest ? "Rest day logged" : "Workout complete!";
  $("finishSub").textContent = prs > 0 ? `${prs} PR${prs === 1 ? "" : "s"} today. Unreal.` : "Logged. The numbers only go up from here.";
  $("summaryText").textContent = summary;
  $("copyNote").textContent = "Paste it in chat and it gets filed in your training log.";
  show("finish");
}

$("startBtn").onclick = startWorkout;
$("backBtn").onclick = () => {
  if (idx === 0) { show("home"); renderHome(); return; }
  idx--; renderCard();
};
$("skipBtn").onclick = () => {
  results[idx] = { name: SPLIT[selectedDay].exercises[idx].name, skipped: true };
  advance();
};
$("nextBtn").onclick = () => {
  if (SPLIT[selectedDay].run) return;
  saveCurrent(); advance();
};
function advance() {
  if (idx === SPLIT[selectedDay].exercises.length - 1) { showAbs(); }
  else { idx++; renderCard(); }
}
$("absYes").onclick = () => { absDone = true; finishSession(); };
$("absNo").onclick = () => { absDone = false; finishSession(); };
$("copyBtn").onclick = async () => {
  const text = $("summaryText").textContent;
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); ta.remove();
  }
  $("copyNote").textContent = "Copied! Paste it in chat.";
};
$("doneBtn").onclick = () => { show("home"); renderHome(); };

renderChips();
renderHome();
</script>
</body>
</html>
